name: nightly

# ADR 11 sections 1 and 4: the full L4 suite on main in both render modes, every test three times over four shards, as
# the flake hunt. The gate runs with retries 0 and --fail-on-flaky-tests; here a test that fails once in three runs is a
# failure, and the summary lists the failures, the flaky count (a guard: it stays 0) and the quarantine count.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Issue 158 (ADR 11 Amendments 2026-11-04): traces without DOM snapshots, whose network log grows with the square of a
  # worker's test count in the worker's shared context; a failure still keeps its trace. The gate keeps the default.
  BLAZIX_TRACE_SNAPSHOTS: "false"

jobs:
  browser-server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sample the disk
        # Issue 158: the free space and the volume of test-results/ every 15 s while the shard runs, summarized below.
        run: |
          df -k --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ' > "$RUNNER_TEMP/disk-start"
          : > "$RUNNER_TEMP/disk-samples"
          nohup bash -c 'while true; do echo "$(df -k --output=avail . | tail -1 | tr -d " ") $(du -sk test-results 2>/dev/null | cut -f1)" >> "$RUNNER_TEMP/disk-samples"; sleep 15; done' > /dev/null 2>&1 &
      - uses: ./.github/actions/browser-tests
        with:
          project: server
          shard: ${{ matrix.shard }}
          shards: 4
          repeat-each: 3
      - name: Report the disk
        if: always()
        run: |
          awk -v start="$(cat "$RUNNER_TEMP/disk-start")" -v job="$JOB" 'NR == 1 { low = $1 } { if ($1 < low) low = $1; if ($2 > peak) peak = $2 }
            END { printf "Disk (%s): %.1f GB free before the setup, %.1f GB at the lowest; test-results/ peaked at %.2f GB\n", job, start / 1048576, low / 1048576, peak / 1048576 }' \
            "$RUNNER_TEMP/disk-samples" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          JOB: ${{ github.job }} (${{ matrix.shard }})

  browser-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sample the disk
        # Issue 158: the free space and the volume of test-results/ every 15 s while the shard runs, summarized below.
        run: |
          df -k --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ' > "$RUNNER_TEMP/disk-start"
          : > "$RUNNER_TEMP/disk-samples"
          nohup bash -c 'while true; do echo "$(df -k --output=avail . | tail -1 | tr -d " ") $(du -sk test-results 2>/dev/null | cut -f1)" >> "$RUNNER_TEMP/disk-samples"; sleep 15; done' > /dev/null 2>&1 &
      - uses: ./.github/actions/browser-tests
        with:
          project: wasm
          shard: ${{ matrix.shard }}
          shards: 4
          repeat-each: 3
      - name: Report the disk
        if: always()
        run: |
          awk -v start="$(cat "$RUNNER_TEMP/disk-start")" -v job="$JOB" 'NR == 1 { low = $1 } { if ($1 < low) low = $1; if ($2 > peak) peak = $2 }
            END { printf "Disk (%s): %.1f GB free before the setup, %.1f GB at the lowest; test-results/ peaked at %.2f GB\n", job, start / 1048576, low / 1048576, peak / 1048576 }' \
            "$RUNNER_TEMP/disk-samples" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          JOB: ${{ github.job }} (${{ matrix.shard }})

  report:
    needs: [browser-server, browser-wasm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge the shard reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-report.json
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports
      - name: Summarize
        run: node .github/scripts/nightly-summary.mjs merged-report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-report
          path: |
            playwright-report
            merged-report.json
          retention-days: 30
