name: Browser tests
description: One shard of one L4 Playwright project against the fixture host (ADR 06 section 2, ADR 11 sections 1 to 4).
inputs:
  project:
    description: The Playwright project, server or wasm.
    required: true
  shard:
    description: The shard index, 1-based.
    required: true
  shards:
    description: The shard count.
    required: true
  specs:
    description: Space-separated spec files of a scoped run; empty runs every spec.
    required: false
    default: ""
  repeat-each:
    description: How many times each test runs (the nightly flake hunt uses 3).
    required: false
    default: "1"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
      with:
        playwright: "true"
    - name: Build the fixture host
      shell: bash
      run: dotnet build tests/Blazix.Primitives.Fixtures -c Debug
    - name: Test (browser)
      # The wasm project depends on wasm-warmup, which Playwright runs first in the same invocation. A shard of a scoped
      # run may hold no test at all, which is not a failure. Retries stay 0 and --fail-on-flaky-tests guards the gate (ADR 11 section 4).
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        SHARD: ${{ inputs.shard }}
        SHARDS: ${{ inputs.shards }}
        SPECS: ${{ inputs.specs }}
        REPEAT_EACH: ${{ inputs.repeat-each }}
      run: |
        args=("--project=$PROJECT" "--shard=$SHARD/$SHARDS" --fail-on-flaky-tests --pass-with-no-tests "--repeat-each=$REPEAT_EACH")
        read -ra spec_files <<< "$SPECS"
        npx playwright test "${args[@]}" "${spec_files[@]}"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: blob-report-${{ inputs.project }}-${{ inputs.shard }}
        path: blob-report
        retention-days: 7
