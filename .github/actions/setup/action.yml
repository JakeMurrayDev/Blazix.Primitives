name: Set up the toolchain
description: The SDK from global.json, Node from .node-version, the NuGet and npm caches, npm ci, and optionally the Playwright browser (ADR 11 section 2).
inputs:
  playwright:
    description: Install the Playwright browser and its system dependencies ("true" or "false").
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: npm # keyed on package-lock.json
    - uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'package-lock.json', '**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-
    - name: Install Node packages
      # Before any .NET build: the library's BlazixBuildJs target runs esbuild from the root node_modules (ADR 04 section 4).
      shell: bash
      run: npm ci
    - name: Resolve the Playwright version
      if: inputs.playwright == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      if: inputs.playwright == 'true'
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('global.json', 'package-lock.json') }}
    - name: Install the Playwright browser
      # The browser alone, from Playwright's CDN; its system libraries are the next step, which apt can fail without
      # failing the job.
      if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install chromium
    - name: Install the Playwright browser's system dependencies
      # apt-get, on a cache hit or a miss: three attempts of at most 120 s each (a healthy run takes 11-34 s), 15 s and
      # 30 s apart, so about 7 minutes at worst. When the Ubuntu mirrors cannot be reached (they failed to resolve from
      # the runners for about 2.5 hours; each failed lookup took about 40 s, so one unbounded attempt outlasted the job's
      # 30 minutes), the step warns and the job relies on the runner image's preinstalled libraries. That masks nothing:
      # a library the image lacks fails the browser's launch with Playwright's own missing-dependency error, which names
      # the library.
      # `timeout` runs as root: as root Playwright runs apt in its own process group, which `timeout` can kill, where
      # as the runner user it goes through `sudo`, which a user's `timeout` cannot signal, leaving apt running.
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if sudo env "PATH=$PATH" timeout --kill-after=10 120 npx playwright install-deps chromium; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            sleep $((attempt * 15))
          fi
        done
        echo "::warning title=Playwright system dependencies::apt-get could not install Chromium's system dependencies in 3 attempts (the Ubuntu mirrors may be unreachable); this job relies on the runner image's preinstalled libraries."
